# CI from the shared SpeedB3 workflows (SpeedB3/.github, docs in CI.md there).
# Keep the jobs your repository needs and delete the rest. Then add .github/CODEOWNERS and the
# repository's ruleset (CI.md, "Merging into main").

name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: SpeedB3/.github/.github/workflows/python-uv.yml@v1
    # with:
    #   working-directory: backend
    #   postgres-version: "18"
    #   postgres-databases: app_test
    #   env: |
    #     TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app_test

  frontend:
    uses: SpeedB3/.github/.github/workflows/node.yml@v1
    with:
      working-directory: frontend
      scripts: lint typecheck test build

  scripts:
    uses: SpeedB3/.github/.github/workflows/scripts.yml@v1

  workflows:
    uses: SpeedB3/.github/.github/workflows/actionlint.yml@v1

