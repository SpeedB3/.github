# CI from the shared SpeedB3 workflows (SpeedB3/.github, docs in CI.md there).
# Keep the jobs your repository needs and delete the rest. Then add .github/CODEOWNERS and the
# ruleset and dependabot.yml (CI.md, "Add CI to a repository").

name: CI

on:
  # Pull requests into the default branch only, not pushes: it must be up to date before a merge,
  # so the pull request run tested exactly what lands (CI.md in SpeedB3/.github, "When CI runs").
  pull_request:
    branches: [$default-branch]
    # Not edited: a title or description change does not rerun CI. A pull request retargeted to main
    # has no ci-ok until its next push (update the branch), so it cannot merge untested.
    types: [opened, synchronize, reopened]
  # The merge queue: an approved pull request is tested once more on top of the default branch and
  # the pull requests ahead of it, then merged (CI.md in SpeedB3/.github, "Merge queue").
  merge_group:
    types: [checks_requested]
  # The "SpeedB3 CI after merge" starter workflow calls it after a merge into another branch.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: SpeedB3/.github/.github/workflows/python-uv.yml@v1
    # with:
    #   working-directory: backend
    #   postgres-version: "18"
    #   postgres-databases: app_test
    #   env: |
    #     TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app_test

  frontend:
    uses: SpeedB3/.github/.github/workflows/node.yml@v1
    with:
      working-directory: frontend
      scripts: lint typecheck test build

  # A Bun project instead (pin the version):
  # frontend:
  #   uses: SpeedB3/.github/.github/workflows/bun.yml@v1
  #   with:
  #     bun-version: "1.4.4"
  #     commands: |
  #       bun test
  #       bun run build

  scripts:
    uses: SpeedB3/.github/.github/workflows/scripts.yml@v1
    # with:
    #   exclude: backend/*.py   # a uv project's Python files; python-uv.yml checks them with its own config (CI.md)

  workflows:
    uses: SpeedB3/.github/.github/workflows/actionlint.yml@v1

  # Lints and builds the Dockerfile (pull requests only build). Publishing to GHCR needs a release
  # workflow on v* tags, because this CI runs on pull requests only (CI.md, container.yml).
  # image:
  #   needs: [python, secrets]
  #   permissions:
  #     contents: read
  #     packages: write
  #   uses: SpeedB3/.github/.github/workflows/container.yml@v1
  #   with:
  #     image: <image-name>
  #     context: .

  secrets:
    uses: SpeedB3/.github/.github/workflows/secrets.yml@v1

  # The one check the ruleset requires (rulesets/repo-default.json). Keep `needs` in step with the jobs
  # above (add `image` if you enable it).
  ci-ok:
    if: always()
    needs: [python, frontend, scripts, workflows, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*|*" skipped "*) exit 1 ;; esac
