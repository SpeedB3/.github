[project]
name = "ci-selftest"
version = "0.0.0"
description = "Fixture for the python-uv.yml self-test."
requires-python = ">=3.12,<3.13"
dependencies = ["packaging>=25"]

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=9.0", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["selftest.py", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = ["."]
