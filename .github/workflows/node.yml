# Reusable CI for an npm project: `npm ci`, then the package.json scripts you list.
#
#   jobs:
#     frontend:
#       uses: SpeedB3/.github/.github/workflows/node.yml@v1
#       with:
#         working-directory: frontend
#         scripts: lint typecheck test build

name: Node (npm)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder that holds package.json and package-lock.json.
        type: string
        default: "."
      node-version:
        type: string
        default: "24"
      scripts:
        description: Space-separated npm scripts to run, in order.
        type: string
        default: "lint typecheck test build"
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci

      - name: Scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          for script in $SCRIPTS; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done
