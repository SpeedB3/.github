# Reusable CI for an npm project: `npm ci`, an audit of the runtime dependencies, then the
# package.json scripts you list.
#
#   jobs:
#     frontend:
#       uses: SpeedB3/.github/.github/workflows/node.yml@v1
#       with:
#         working-directory: frontend
#         scripts: lint typecheck test build
#
# The status check is "<caller job> / node", e.g. "frontend / node".

name: Node (npm)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder that holds package.json and package-lock.json.
        type: string
        default: "."
      node-version:
        description: Node.js version for actions/setup-node.
        type: string
        default: "24"
      scripts:
        description: Whitespace-separated (spaces or newlines) npm scripts to run, in order.
        type: string
        default: "lint typecheck test build"
      audit-level:
        description: Fail on runtime-dependency advisories at this level or above (low, moderate, high, critical); empty skips the audit.
        type: string
        default: high
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 15

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install (fails if package-lock.json is out of date)
        run: npm ci --no-audit --no-fund

      - name: Audit runtime dependencies
        if: inputs.audit-level != ''
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: npm audit --omit=dev --audit-level="$AUDIT_LEVEL"

      - name: Scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          read -r -d '' -a scripts <<< "$SCRIPTS" || true
          for script in "${scripts[@]}"; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done
