# Reusable secret scan of the calling repository's full git history with gitleaks.
# A `.gitleaks.toml` at the repository root extends or allowlists rules (e.g. fake keys in test
# fixtures); a `.gitleaksignore` lists fingerprints of findings already dealt with.
#
#   jobs:
#     secrets:
#       uses: SpeedB3/.github/.github/workflows/secrets.yml@v1
#
# The status check is "<caller job> / gitleaks", e.g. "secrets / gitleaks".

name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned and checksum-verified, like shellcheck in scripts.yml.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: gitleaks
        run: |
          gitleaks version
          gitleaks git --redact --no-banner --verbose .
