# Reusable check of the calling repository's workflow files with actionlint (and shellcheck),
# including the starter workflows in workflow-templates/ when that folder exists. It also checks
# that a `ci-ok` job needs every other job of its workflow.
#
#   jobs:
#     workflows:
#       uses: SpeedB3/.github/.github/workflows/actionlint.yml@v1
#
# The status check is "<caller job> / actionlint", e.g. "workflows / actionlint".

name: Lint workflows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml workflow-templates/*.yml workflow-templates/*.yaml)
          ./actionlint -color "${files[@]}"

      # ci-ok is the only check the rulesets require, so a job missing from its needs is never enforced.
      - name: ci-ok needs every job
        run: |
          status=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml workflow-templates/*.yml; do
            [ -f "$f" ] || continue
            [ "$(yq '.jobs | has("ci-ok")' "$f")" = "true" ] || continue
            missing=$(comm -23 <(yq '.jobs | keys | .[]' "$f" | grep -vx 'ci-ok' | sort) \
                               <(yq '.jobs."ci-ok".needs[]' "$f" | sort))
            if [ -n "$missing" ]; then
              echo "::error file=$f::ci-ok does not need: $(echo "$missing" | tr '\n' ' ')"
              status=1
            fi
          done
          exit "$status"
