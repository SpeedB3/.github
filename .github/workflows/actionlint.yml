# Reusable check of the calling repository's workflow files with actionlint (and shellcheck),
# including the starter workflows in workflow-templates/ when that folder exists. It also checks
# that a `ci-ok` job needs every other job of its workflow and runs with `if: always()`.
#
#   jobs:
#     workflows:
#       uses: SpeedB3/.github/.github/workflows/actionlint.yml@v1
#
# The status check is "<caller job> / actionlint", e.g. "workflows / actionlint".

name: Lint workflows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint is pinned (download-script commit and version argument on the run: line); the
      # shellcheck it runs on run: blocks and the yq of the next step come from the runner image.
      - name: actionlint
        run: |
          command -v shellcheck >/dev/null || { echo '::error::shellcheck not found on the runner'; exit 1; }
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml workflow-templates/*.yml workflow-templates/*.yaml)
          ./actionlint -color "${files[@]}"

      # ci-ok is the only check the rulesets require, so a job missing from its needs is never enforced,
      # and a ci-ok without if: always() is skipped (which counts as passing) when a job fails.
      - name: ci-ok needs every job
        run: |
          command -v yq >/dev/null || { echo '::error::yq not found on the runner'; exit 1; }
          status=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml workflow-templates/*.yml workflow-templates/*.yaml; do
            [ -f "$f" ] || continue
            has=$(yq '.jobs | has("ci-ok")' "$f")
            [ "$has" = "true" ] || continue
            jobs=$(yq '.jobs | keys | .[]' "$f")
            needs=$(yq '[.jobs."ci-ok".needs] | flatten | .[]' "$f")
            missing=$(comm -23 <(grep -vx 'ci-ok' <<< "$jobs" | sort) <(sort <<< "$needs"))
            if [ -n "$missing" ]; then
              echo "::error file=$f::ci-ok does not need: $(echo "$missing" | tr '\n' ' ')"
              status=1
            fi
            cond=$(yq '.jobs."ci-ok"."if" // ""' "$f")
            case "$cond" in
              *'always()'*|*'!cancelled()'*) ;;
              *) echo "::error file=$f::ci-ok must run with if: always() (or !cancelled()), or a failed job skips it and the required check passes"; status=1 ;;
            esac
          done
          exit "$status"
