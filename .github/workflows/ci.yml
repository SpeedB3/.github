# CI of this repository: every shared workflow runs, one job per scenario, against its fixture in
# tests/ (actionlint and gitleaks run over this repository itself), from this commit (local `./`
# paths, not @v1). A change here must keep them all green before `v1` moves.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    uses: ./.github/workflows/actionlint.yml

  python:
    uses: ./.github/workflows/python-uv.yml
    with:
      working-directory: tests/python
      env: |
        SELFTEST_MARKER=set-by-caller
      # The audit step skips pip-audit when its export has no pinned line, so fail if packaging was not
      # exported (and therefore not audited).
      extra-commands: grep -q '^packaging==' "$RUNNER_TEMP/requirements.txt"

  python-postgres:
    uses: ./.github/workflows/python-uv.yml
    with:
      working-directory: tests/python
      postgres-version: "18"
      postgres-databases: selftest_db other_db
      env: |
        SELFTEST_MARKER=set-by-caller
        TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/selftest_db
      pytest-args: -q -rs
      format-check: false
      audit: false
      pyright: false
      extra-commands: |
        psql "$TEST_DATABASE_URL" -tAc 'select 1' | grep -qx 1
        psql postgresql://postgres:postgres@localhost:5432/other_db -tAc 'select 1' | grep -qx 1

  node:
    uses: ./.github/workflows/node.yml
    with:
      working-directory: tests/node

  container:
    # container.yml asks for packages: write; with publish: false nothing is pushed.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      image: ci-selftest
      context: tests/container
      publish: false

  scripts:
    uses: ./.github/workflows/scripts.yml
    with:
      exclude: tests/scripts/excluded/* tests/python/*.py
      python-tests: tests/scripts/selftest.py

  secrets:
    uses: ./.github/workflows/secrets.yml

  # The one check the ruleset requires. Add every new job above to `needs`.
  ci-ok:
    if: always()
    needs: [workflows, python, python-postgres, node, container, scripts, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SCRIPT_COUNTS: ${{ needs.scripts.outputs.python-files }} ${{ needs.scripts.outputs.shell-files }} ${{ needs.scripts.outputs.powershell-files }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
          read -r -a counts <<< "$SCRIPT_COUNTS"
          [ "${#counts[@]}" = 3 ] || { echo "scripts self-test did not report three file counts"; exit 1; }
          for c in "${counts[@]}"; do [ "$c" != 0 ] || { echo "scripts self-test checked no files of a language"; exit 1; }; done
