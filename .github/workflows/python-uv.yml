# Reusable CI for a Python project managed with uv: lock check, dependency audit, ruff, pyright, pytest.
# Optionally starts PostgreSQL and creates the databases the tests need.
# The project must have ruff and pytest, and unless `pyright: false` also pyright, in its dev
# dependency group.
#
#   jobs:
#     backend:
#       uses: SpeedB3/.github/.github/workflows/python-uv.yml@v1
#       with:
#         working-directory: backend
#         postgres-version: "18"
#         postgres-databases: kb kb_test
#         env: |
#           TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/kb_test
#
# A dependency from a private repository of this organisation (`name @ git+https://github.com/...` in
# pyproject.toml) is installed with a short-lived, read-only token of the organisation's GitHub App:
#
#       with:
#         app-client-id: ${{ vars.PRIVATE_DEPS_APP_CLIENT_ID }}
#         app-repositories: the-private-repo
#       secrets:
#         app-private-key: ${{ secrets.PRIVATE_DEPS_APP_PRIVATE_KEY }}
#
# The status check is "<caller job> / python", e.g. "backend / python".

name: Python (uv)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder that holds pyproject.toml and uv.lock.
        type: string
        default: "."
      python-version:
        description: Python version; empty uses the project's .python-version or requires-python.
        type: string
        default: ""
      format-check:
        description: Run `ruff format --check`.
        type: boolean
        default: true
      pyright:
        description: Run pyright (it must be a dev dependency).
        type: boolean
        default: true
      audit:
        description: Fail on known vulnerabilities (pip-audit) in the runtime dependencies of uv.lock, like node.yml's npm audit.
        type: boolean
        default: true
      pytest-args:
        description: Whitespace-separated (spaces or newlines) pytest arguments; they replace the default "-q", e.g. "-q -n auto".
        type: string
        default: "-q"
      postgres-version:
        description: Start a PostgreSQL service of this major version; empty for none.
        type: string
        default: ""
      postgres-databases:
        description: Whitespace-separated (spaces or newlines) databases to create (user postgres, password postgres, localhost:5432).
        type: string
        default: "test"
      env:
        description: KEY=VALUE lines set for every step after the install.
        type: string
        default: ""
      extra-commands:
        description: Shell commands run after the tests (e.g. generated-file checks); stops at the first failure.
        type: string
        default: ""
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 20
      app-client-id:
        description: Client ID of the organisation GitHub App that reads private dependencies; empty for none.
        type: string
        default: ""
      app-repositories:
        description: Comma- or newline-separated repositories of this organisation the token may read (names only); required with app-client-id.
        type: string
        default: ""
    secrets:
      app-private-key:
        description: Private key of that GitHub App (required with app-client-id).
        required: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    services:
      postgres:
        # An empty image skips the service.
        image: ${{ inputs.postgres-version != '' && format('postgres:{0}', inputs.postgres-version) || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned like the other tools, so a uv release cannot change every caller's gate at once.
          version: "0.13.6"
          # Off with private dependencies: a cache restored by a later run, a fork's included, could
          # hold wheels built from their source.
          enable-cache: ${{ inputs.app-client-id == '' }}
          working-directory: ${{ inputs.working-directory }}
          python-version: ${{ inputs.python-version }}

      # Private dependencies: a token that can only read the listed repositories, valid for about
      # an hour and revoked when the job ends. Only the install step gets it.
      - name: Check private dependency inputs
        if: inputs.app-client-id != ''
        env:
          REPOS: ${{ inputs.app-repositories }}
        run: |
          # Without a list, the token could read every repository the App is installed on.
          if ! printf '%s' "$REPOS" | grep -q '[A-Za-z0-9._-]'; then
            echo "::error::app-repositories is required with app-client-id."
            exit 1
          fi

      - name: Token for private dependencies
        id: app-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.app-repositories }}
          permission-contents: read

      - name: Install (fails if uv.lock is out of date)
        env:
          # Git, run by uv, reads the private repositories with the token; this step's environment
          # is the only place it is set. Later `uv run` steps do not fetch them again.
          GIT_CONFIG_COUNT: ${{ inputs.app-client-id != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: uv sync --locked

      - name: Set environment
        if: inputs.env != ''
        env:
          EXTRA_ENV: ${{ inputs.env }}
        run: printf '%s\n' "$EXTRA_ENV" >> "$GITHUB_ENV"

      - name: Audit runtime dependencies
        if: inputs.audit
        run: |
          uv export --locked --format requirements-txt --no-dev --no-emit-project --no-emit-workspace \
            --quiet -o "$RUNNER_TEMP/requirements.txt"
          # A dependency from a git repository (`name @ git+https://...`) has no version to look up;
          # its own dependencies are listed separately and audited.
          sed -i -E '/^[A-Za-z0-9._-]+ @ git\+/d' "$RUNNER_TEMP/requirements.txt"
          if ! grep -q '==' "$RUNNER_TEMP/requirements.txt"; then
            echo "No runtime dependencies to audit."
            exit 0
          fi
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off

      - name: Create databases
        if: inputs.postgres-version != ''
        env:
          PGPASSWORD: postgres
          DATABASES: ${{ inputs.postgres-databases }}
        run: |
          read -r -d '' -a dbs <<< "$DATABASES" || true
          for db in "${dbs[@]}"; do
            psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$db\""
          done

      - name: Ruff lint
        run: uv run ruff check --no-fix --output-format=github .

      - name: Ruff format
        if: inputs.format-check
        run: uv run ruff format --check .

      - name: Pyright
        if: inputs.pyright
        run: uv run pyright

      - name: Pytest
        env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: |
          read -r -d '' -a args <<< "$PYTEST_ARGS" || true
          uv run pytest "${args[@]}"

      - name: Extra checks
        if: inputs.extra-commands != ''
        env:
          EXTRA_COMMANDS: ${{ inputs.extra-commands }}
        run: bash -euo pipefail -c "$EXTRA_COMMANDS"
