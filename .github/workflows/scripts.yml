# Reusable CI for scripts (skills, tooling): checks every .py, .sh, .bash, .ps1 and .psm1 file in the
# repository outside .git. List folders that belong to a uv or npm project (python-uv.yml and node.yml
# check those with their own config) in `exclude`, because Ruff runs here with --isolated and ignores
# the project's ruff config.
# One job per language; a job with no files of its language passes without checking anything.
#   python:     py_compile, ruff (bug rules only by default), then the self-tests you list
#   shell:      shellcheck
#   powershell: PSScriptAnalyzer (errors and parse errors)
#
#   jobs:
#     scripts:
#       uses: SpeedB3/.github/.github/workflows/scripts.yml@v1
#       with:
#         exclude: "*/evals/*"
#         python-tests: tech/skills/custom/deep-review/scripts/guard_selftest.py
#
# The status checks are "<caller job> / python", "<caller job> / shell", "<caller job> / powershell".

name: Scripts

on:
  workflow_call:
    inputs:
      exclude:
        description: Whitespace-separated (spaces or newlines) folders or path globs to skip, relative to the repository root (find -path syntax), e.g. "backend */evals/*".
        type: string
        default: ""
      ruff-select:
        description: Ruff rules for Python scripts.
        type: string
        default: "E9,F"
      python-version:
        description: Python version used to compile, lint and run the self-tests.
        type: string
        default: "3.12"
      python-tests:
        description: Whitespace-separated (spaces or newlines) Python scripts that exit non-zero on failure.
        type: string
        default: ""

permissions:
  contents: read

env:
  EXCLUDE: ${{ inputs.exclude }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
          # Nothing to cache (no project), and saving an empty cache fails the job.
          enable-cache: false

      - name: List files
        id: files
        run: |
          read -r -d '' -a globs <<< "$EXCLUDE" || true
          args=()
          for g in "${globs[@]}"; do g=${g#./}; g=${g%/}; args+=(-not -path "./$g" -not -path "./$g/*"); done
          find . -name '*.py' -not -path './.git/*' "${args[@]}" -print0 > "$RUNNER_TEMP/files"
          count=$(tr -cd '\0' < "$RUNNER_TEMP/files" | wc -c)
          echo "Checking $count Python files:"
          tr '\0' '\n' < "$RUNNER_TEMP/files"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Compile
        if: steps.files.outputs.count != '0'
        run: xargs -0 uv run --no-project python -B -m py_compile < "$RUNNER_TEMP/files"

      - name: Ruff
        if: steps.files.outputs.count != '0'
        env:
          RUFF_SELECT: ${{ inputs.ruff-select }}
        run: xargs -0 uvx ruff@0.17.3 check --isolated --output-format=github --select "$RUFF_SELECT" < "$RUNNER_TEMP/files"

      - name: Self-tests
        if: inputs.python-tests != ''
        env:
          TESTS: ${{ inputs.python-tests }}
        run: |
          read -r -d '' -a tests <<< "$TESTS" || true
          for t in "${tests[@]}"; do
            echo "::group::$t"
            uv run --no-project python -B "$t"
            echo "::endgroup::"
          done

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List files
        id: files
        run: |
          read -r -d '' -a globs <<< "$EXCLUDE" || true
          args=()
          for g in "${globs[@]}"; do g=${g#./}; g=${g%/}; args+=(-not -path "./$g" -not -path "./$g/*"); done
          find . \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' "${args[@]}" -print0 > "$RUNNER_TEMP/files"
          count=$(tr -cd '\0' < "$RUNNER_TEMP/files" | wc -c)
          echo "Checking $count shell files:"
          tr '\0' '\n' < "$RUNNER_TEMP/files"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: shellcheck
        if: steps.files.outputs.count != '0'
        run: xargs -0 shellcheck --format=gcc < "$RUNNER_TEMP/files"

  powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List files
        id: files
        run: |
          read -r -d '' -a globs <<< "$EXCLUDE" || true
          args=()
          for g in "${globs[@]}"; do g=${g#./}; g=${g%/}; args+=(-not -path "./$g" -not -path "./$g/*"); done
          find . \( -name '*.ps1' -o -name '*.psm1' \) -not -path './.git/*' "${args[@]}" -print0 > "$RUNNER_TEMP/files"
          count=$(tr -cd '\0' < "$RUNNER_TEMP/files" | wc -c)
          echo "Checking $count PowerShell files:"
          tr '\0' '\n' < "$RUNNER_TEMP/files"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: PSScriptAnalyzer
        if: steps.files.outputs.count != '0'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $files = @([IO.File]::ReadAllText("$env:RUNNER_TEMP/files").Split([char]0, [StringSplitOptions]::RemoveEmptyEntries))
          $found = $files | Invoke-ScriptAnalyzer -Severity Error, ParseError
          $found | Format-Table -AutoSize | Out-String -Width 200
          if ($found) { exit 1 }
