# Reusable CD: builds a container image and publishes it to GitHub Container Registry.
# Pull requests only build it. Pushes to the default branch publish :main, :sha-<short> and
# :latest; tags v1.2.3 publish :1.2.3 and :1.2. The caller must grant `packages: write`.
#
#   jobs:
#     image:
#       needs: [backend]
#       permissions:
#         contents: read
#         packages: write
#       uses: SpeedB3/.github/.github/workflows/container.yml@v1
#       with:
#         image: genaifinops-backend
#         context: backend

name: Container image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/speedb3/ (lowercase).
        type: string
        required: true
      context:
        description: Build context folder.
        type: string
        default: "."
      file:
        description: Dockerfile path; empty means <context>/Dockerfile.
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64
    outputs:
      digest:
        description: Digest of the image (empty when only built).
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      PUSH: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/speedb3/${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
